name: Health check

# Scheduled health check for staging + production critical endpoints.
# Runs the repo's health-check.py; on failure it opens (or updates) a
# GitHub issue so the breakage is visible, not silent.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    name: Check staging + production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        id: check
        run: python3 health-check.py
        continue-on-error: true

      - name: Report failure with agentic diagnosis
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Pookie health check failing — needs diagnosis';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['health-check']
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Health check failed at ${new Date().toISOString()}.`,
              ``,
              `**Failing run:** ${runUrl}`,
              ``,
              `**For the coding agent:**`,
              `1. Read \`docs/health-status.json\` from the failing run's artifacts (or re-run \`python3 health-check.py\` locally) to see which endpoints failed.`,
              `2. Check the relevant route handler in \`src/app/\` and recent commits touching it.`,
              `3. Common causes: stale Pages deployment (see docs/DEPLOY-LOG.md), missing DB migration, RLS policy blocking, Supabase outage.`,
              `4. Propose a fix as a PR against \`staging-build\`. Do NOT touch production.`,
              ``,
              `> Auto-generated by the health-check workflow. Assign to Copilot for agentic diagnosis.`,
            ].join('\n');
            let issueNumber;
            if (issues.data.length === 0) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['health-check', 'copilot-agent']
              });
              issueNumber = created.data.number;
            } else {
              issueNumber = issues.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, body
              });
            }
            // Ask Copilot coding agent to diagnose (requires Copilot enabled on repo).
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, assignees: ['copilot']
              });
            } catch (e) {
              console.log('Could not auto-assign Copilot (may need manual assignment):', e.message);
            }

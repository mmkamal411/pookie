name: Health check

# Scheduled health check for staging + production critical endpoints.
# Runs the repo's health-check.py; on failure it opens (or updates) a
# GitHub issue so the breakage is visible, not silent.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health:
    name: Check staging + production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        id: check
        run: python3 health-check.py
        continue-on-error: true

      - name: Report failure
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Pookie health check failing';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['health-check']
            });
            const body = `Health check failed at ${new Date().toISOString()}.\n\n` +
              `See the [failing run](${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId}) for details.`;
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['health-check']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number, body
              });
            }
